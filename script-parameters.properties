# Important: this is where you define what you want to install

# [EXECUTE]
# this flag is used to execute commands $MY_CLUSTER_COMMAND apply ...
MY_APPLY_FLAG=true

# [RH INSTALL]
MY_CERTMANAGER=true
MY_LIC_SRV=true
MY_LIC_SRV_REPORTER=true
MY_LOGGING_LOKI=false

# Cluster Observability Operator
MY_COO=false

# Required for Common Services, TODO: gitops maybe redhat one, need to check this
MY_GITOPS=false
MY_OADP=false
MY_KEYCLOAK_EXTERNAL=true
MY_KEYCLOAK_INTEGRATION=false
MY_CLUSTER_MONITORING=false
MY_TEKTON=false

# [CP4I INSTALL]
MY_COMMONSERVICES=true
MY_ACE=true
# MY_APIC and MY_IDIG are mutually exclusive (IDIG ships its own API Connect operator and CRDs).
# Set only one of them to true, otherwise the script stops before any oc command.
MY_APIC=false
MY_APIC_BY_COMPONENT=true
MY_APIC_NANOGTW=true
MY_APIC_WMFAM=true
MY_APIC_WMGTW=false
MY_APIC_WMDPTL=true
MY_APIC_GRAPHQL=false
MY_ASSETREPO=false
# End-to-end monitoring operator (ibm-integration-monitoring)
MY_E2E_MONITORING=false

MY_DPGW=false
# DataPower Interact Gateway (IDIG, MCP tools hosting): namespace ibmint-idig. Exclusive with MY_APIC.
# TEMPORARY installation, until the Expert Labs solution is ready to be merged.
MY_IDIG=true
# Directory where the IDIG release package (Passport Advantage) is extracted: it contains dependencies/, samples/,
# helper_files/, ibm-idig-nanogw.yaml and ibm-idig-operator.yaml. Mandatory when MY_IDIG=true.
# Package idig-operator-release-files_12.1.1.3.zip, extracted outside of the repository.
MY_IDIG_PACKAGE_DIR=${HOME}/TechZone-NEW/idig-12.1.1.3
# Registry path that replaces REPLACE-DOCKER-REGISTRY in the YAML files, as seen BY THE PODS.
# Here: the OpenShift internal registry, where the idig-image-tool uploaded the images (flat names, see
# retagged-idig-image-list.yaml in the package): image-registry.openshift-image-registry.svc:5000/ibmint-idig.
# With this value install_idig creates the pull secret from a service account (role system:image-puller).
# For an external registry, set it here and put MY_IDIG_REGISTRY_USER/PASSWORD in private/user.properties.
MY_IDIG_REGISTRY=image-registry.openshift-image-registry.svc:5000/ibmint-idig
# Optional: deploy the Valkey operator and instance (Redis compatible database used by the Nano Gateway)
MY_IDIG_VALKEY=true
# Optional: patch the default IngressController with wildcardPolicy=WildcardsAllowed.
# CLUSTER-WIDE setting: it needs the approval of a cluster administrator. false = only the command is displayed.
MY_IDIG_PATCH_WILDCARD=true
MY_HSTS=false
MY_INTASSEMBLY=false
MY_MQ=true
MY_MESSAGINGSERVER=false
MY_NAVIGATOR=true
# Explain why this one. May be required for ACE Designer (tbc)
MY_NAVIGATOR_INSTANCE=true
# Integration Software Agent in Platform UI (needs Platform UI >= 16.2.1 and watsonx.ai)
MY_INTEGRATION_AGENT=false

# [CP4I DEMOS]
# Important: this is where you define if you want to customise each component
MY_ACE_CUSTOM=true
MY_APIC_CUSTOM=false
MY_ASSETREPO_CUSTOM=false
# End-to-end monitoring instance (Monitoring CR)
MY_E2E_MONITORING_CUSTOM=false
MY_DPGW_CUSTOM=false
MY_HSTS_CUSTOM=false
MY_MQ_CUSTOM=true
MY_LDAP_CUSTOM=false
MY_KEYCLOAK_CUSTOM=true
MY_NAVIGATOR_CUSTOM=true

# [EVENT_AUTOMATION INSTALL]
MY_ES=false
MY_EEM=false
MY_EGW=false
MY_EP=false
MY_FLINK=false

# [CONFLUENT INSTALL]
MY_CONFLUENT=false

# [EVENT_AUTOMATION/CONFLUENT DEMOS]
MY_ES_CUSTOM=false
MY_EEM_CUSTOM=false
MY_EGW_CUSTOM=false
MY_EP_CUSTOM=false
MY_FLINK_CUSTOM=false
MY_CONFLUENT_CUSTOM=false

# [CP4AIOPS INSTALL]
MY_INSTANA=false

# [CP4AIOPS DEMOS]
MY_INSTANA_CUSTOM=false

# [CP4APP INSTALL]
MY_WASLIBERTY=true

# [Liberty DEMOS]
# It is likely that if you have the latest image, you do not need to build it over and over
MY_WASLIBERTY_CUSTOM=true
# It is likely that if you have the latest image in your image registry, you do not need to build it over and over
MY_WASLIBERTY_CUSTOM_BUILD=true

# [OTHERS]
MY_LDAP=false
MY_LDAP_CUSTOM_BUILD=false
# Mail is a prerequisite for APIC
MY_MAILHOG=true
MY_DEBUG_TOOL=false

# Warning this feature may open security holes
MY_SFTP=false

# SB]20261110 The cluster setup is done only once per cluster: when it succeeds, a marker ConfigMap
# ($MY_INIT_MARKER_CM in $MY_OPERATORS_NAMESPACE) is created and the next runs skip it.
# To force it again: MY_FORCE_INIT=true ./provision_cluster-v2.sh --call ...
# or  : oc -n openshift-operators delete configmap cp4i-install-init
# The cluster variables (VAR_CLUSTER_DOMAIN, ...) are always computed, they are needed by the other functions.
MY_INIT_MARKER_CM="cp4i-install-init"