# Confluent KRaftController operand template
# KRaft mode: Zookeeper-less Kafka controller quorum (KIP-500)
# Reference: https://docs.confluent.io/operator/current/co-kraft.html
#
# Image note: the CFK API reference shows cp-server for KRaftController,
# not confluent-local. Both VAR_CONFLUENT_KAFKA_IMAGE and VAR_CONFLUENT_SERVER_IMAGE
# are set to MY_CONFLUENT_SERVER_IMAGE (cp-server) in provision_cluster-v2.sh.
# Ref: https://docs.confluent.io/operator/current/co-api.html
#
# StorageClass note: use a block StorageClass (e.g. ocs-storagecluster-ceph-rbd).
# CFK documentation excludes network file systems (NFS, CephFS) for Kafka data.
# Ref: https://docs.confluent.io/operator/current/co-storage.html
#
# SCC note: podSecurityContext is intentionally empty so OpenShift assigns UIDs
# from the namespace range (official Confluent OpenShift recommendation).
# Ref: https://github.com/confluentinc/confluent-kubernetes-examples/tree/master/security/openshift-security
#
# Variables substituted at runtime (via adapt_file / envsubst):
#   ${VAR_CONFLUENT_NAMESPACE}                - namespace (e.g. iwhi-confluent)
#   ${VAR_CONFLUENT_KRAFTCONTROLLER_REPLICAS} - number of controller replicas (default 3)
#   ${VAR_CONFLUENT_KAFKA_IMAGE}              - controller image (cp-server, set = SERVER_IMAGE)
#   ${VAR_CONFLUENT_INIT_IMAGE}               - init-container image
#   ${VAR_CONFLUENT_DATA_VOLUME_CAPACITY}     - PVC size (e.g. 10Gi)
#   ${VAR_CONFLUENT_STORAGE_CLASS}            - block StorageClass (e.g. ocs-storagecluster-ceph-rbd)
#   ${VAR_CONFLUENT_TLS_AUTO_CERTS}           - true (cfk-managed) or false (provided-secret)
#   ${VAR_CONFLUENT_CA_ANNOTATION}            - annotation line for cfk-managed CA, or empty
#
apiVersion: platform.confluent.io/v1beta1
kind: KRaftController
metadata:
  name: kraftcontroller
  namespace: ${VAR_CONFLUENT_NAMESPACE}
  annotations:
    ${VAR_CONFLUENT_CA_ANNOTATION}
  labels:
    app.kubernetes.io/name: kraftcontroller
    app.kubernetes.io/part-of: confluent-platform
spec:
  replicas: ${VAR_CONFLUENT_KRAFTCONTROLLER_REPLICAS}
  image:
    application: ${VAR_CONFLUENT_KAFKA_IMAGE}
    init: ${VAR_CONFLUENT_INIT_IMAGE}
  dataVolumeCapacity: ${VAR_CONFLUENT_DATA_VOLUME_CAPACITY}
  storageClass:
    name: ${VAR_CONFLUENT_STORAGE_CLASS}
  tls:
    autoGeneratedCerts: ${VAR_CONFLUENT_TLS_AUTO_CERTS}
  podTemplate:
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 2Gi
    # Empty podSecurityContext: let OpenShift assign UIDs from the namespace range.
    # Do NOT set fsGroup or runAsUser here — see SCC note above.
    podSecurityContext: {}
