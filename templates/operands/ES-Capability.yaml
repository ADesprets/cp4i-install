apiVersion: eventstreams.ibm.com/v1
kind: EventStreams
metadata:
  name: $VAR_ES_INSTANCE_NAME
  namespace: $VAR_ES_NAMESPACE
  labels:
    backup.eventstreams.ibm.com/component: eventstreams
spec:
  version: $MY_ES_VERSION
  license: 
    license: $MY_ES_LIC
    accept: true
    use: $MY_ES_LIC_USAGE
  strimziOverrides:
    entityOperator:
      topicOperator: {}
    nodePools:
      - name: kafka
        replicas: 3  # 3 brokers for high availability
        storage:
          type: "persistent-claim"
          size: "30Gi"
          class: ${OCP_BLOCK_STORAGE}
          deleteClaim: false  # Prevent accidental data loss
        roles:
          - broker
      - name: controller
        replicas: 3  # 3 controllers for HA (quorum-based)
        storage:
          type: "persistent-claim"
          size: "10Gi"  # Controllers need less storage
          class: ${OCP_BLOCK_STORAGE}
          deleteClaim: false
        roles:
          - controller
    kafka:
      # Note: replicas setting ignored when using nodePools
      config:
        auto.create.topics.enable: 'false'
        # 3-broker replication settings for high availability
        offsets.topic.replication.factor: 3
        transaction.state.log.min.isr: 2
        transaction.state.log.replication.factor: 3
        default.replication.factor: 3
        min.insync.replicas: 2  # Allows 1 broker failure
        log.retention.hours: 48  # 2 days retention
        log.segment.bytes: 1073741824
        compression.type: 'producer'
      resources:
        requests:
          memory: 4Gi
          cpu: 2000m
        limits:
          memory: 8Gi
          cpu: 4000m
      authorization:
        type: simple
      listeners:
        - name: external
          port: 9094
          type: route
          tls: true
          authentication:
            type: scram-sha-512
        - name: tls
          port: 9093
          type: internal
          tls: true
          authentication:
            type: tls
      metricsConfig:
        type: jmxPrometheusExporter
        valueFrom:
          configMapKeyRef:
            key: kafka-metrics-config.yaml
            name: ${VAR_ES_METRICS_CM}
  adminApi: {}
  adminUI:
     authentication:
       - type: scram-sha-512
  apicurioRegistry: {}
  collector: {}
  restProducer: {}
  security:
    internalTls: TLSv1.2