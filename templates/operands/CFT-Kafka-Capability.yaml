# Confluent Kafka operand template
# KRaft mode: depends on KRaftController named "kraftcontroller"
# Reference: https://docs.confluent.io/operator/current/co-configure-kafka.html
#
# StorageClass: must be a block StorageClass (e.g. ocs-storagecluster-ceph-rbd).
# CFK documentation explicitly excludes network file systems for Kafka data volumes.
# Use MY_CONFLUENT_STORAGE_CLASS, not MY_FILE_STORAGE_CLASS.
# Ref: https://docs.confluent.io/operator/current/co-storage.html
#
# TLS: driven by VAR_CONFLUENT_TLS_AUTO_CERTS and VAR_CONFLUENT_CA_ANNOTATION.
# autoGeneratedCerts: true requires an explicit CA Secret (annotation).
# Ref: https://docs.confluent.io/operator/current/co-network-encryption.html
#
# SCC: empty podSecurityContext so OpenShift assigns UIDs from namespace range.
# Ref: https://github.com/confluentinc/confluent-kubernetes-examples/tree/master/security/openshift-security
#
# Variables substituted at runtime (via adapt_file / envsubst):
#   ${VAR_CONFLUENT_NAMESPACE}            - namespace (e.g. iwhi-confluent)
#   ${VAR_CONFLUENT_KAFKA_REPLICAS}       - number of broker replicas (default 3)
#   ${VAR_CONFLUENT_SERVER_IMAGE}         - Kafka server image (confluentinc/cp-server:8.3.2)
#   ${VAR_CONFLUENT_INIT_IMAGE}           - init-container image
#   ${VAR_CONFLUENT_DATA_VOLUME_CAPACITY} - PVC size (e.g. 10Gi)
#   ${VAR_CONFLUENT_STORAGE_CLASS}        - block StorageClass (e.g. ocs-storagecluster-ceph-rbd)
#   ${VAR_CONFLUENT_TLS_AUTO_CERTS}       - true (cfk-managed) or false (provided-secret)
#   ${VAR_CONFLUENT_CA_ANNOTATION}        - annotation line for cfk-managed CA, or empty
#
apiVersion: platform.confluent.io/v1beta1
kind: Kafka
metadata:
  name: kafka
  namespace: ${VAR_CONFLUENT_NAMESPACE}
  annotations:
    ${VAR_CONFLUENT_CA_ANNOTATION}
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: confluent-platform
spec:
  replicas: ${VAR_CONFLUENT_KAFKA_REPLICAS}
  image:
    application: ${VAR_CONFLUENT_SERVER_IMAGE}
    init: ${VAR_CONFLUENT_INIT_IMAGE}
  dataVolumeCapacity: ${VAR_CONFLUENT_DATA_VOLUME_CAPACITY}
  storageClass:
    name: ${VAR_CONFLUENT_STORAGE_CLASS}
  dependencies:
    kRaftController:
      clusterRef:
        name: kraftcontroller
  tls:
    autoGeneratedCerts: ${VAR_CONFLUENT_TLS_AUTO_CERTS}
  podTemplate:
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 4Gi
    # Empty podSecurityContext: let OpenShift assign UIDs from the namespace range.
    # Do NOT set fsGroup or runAsUser here — see SCC note above.
    podSecurityContext: {}
