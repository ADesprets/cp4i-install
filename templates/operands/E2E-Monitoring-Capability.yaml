apiVersion: integration.ibm.com/v1beta1
kind: Monitoring
metadata:
  # The name must not contain a number
  name: ${VAR_E2E_MONITORING_INSTANCE_NAME}
  namespace: ${VAR_E2E_MONITORING_NAMESPACE}
spec:
  license:
    accept: true
    license: ${MY_E2E_MONITORING_LIC}
  version: ${MY_E2E_MONITORING_VERSION}
  # Sizing based on the "small" profile provided by the operator
  collector:
    replicas: 2
    resources:
      limits:
        cpu: 700m
        memory: 3Gi
      requests:
        cpu: 700m
        memory: 3Gi
  configurations:
    ruleViolation:
      schedule: '*/5 * * * *'
  datastore:
    replicas: 3
    resources:
      limits:
        cpu: '1'
        memory: 3Gi
      requests:
        cpu: '1'
        memory: 3Gi
    storage:
      # Block storage class supporting RWO volumes
      class: ${OCP_BLOCK_STORAGE}
      data:
        size: 16Gi
      deployment:
        size: 4Gi
  ui:
    replicas: 1
    resources:
      limits:
        cpu: 600m
        memory: 3Gi
      requests:
        cpu: 600m
        memory: 3Gi
