apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${MY_E2E_MONITORING_ROLEBINDING}
  namespace: ${VAR_E2E_MONITORING_NAMESPACE}
subjects:
  - kind: ServiceAccount
    name: ${MY_E2E_MONITORING_SERVICEACCOUNT}
    namespace: ${VAR_E2E_MONITORING_NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  # Role created by the operator for the Monitoring instance
  name: ${VAR_E2E_MONITORING_INSTANCE_NAME}-e2em-traces
