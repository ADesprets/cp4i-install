kind: assertion
apiVersion: api.ibm.com/v1
metadata:
  name: 200-success
  namespace: dpv6
  version: "1.0"
  tags:
    - assertion
spec:
  - name: Validate response status code is 200
    key: responseStatus
    value: 200
    action: equals
    stopOnFail: false
  - name: Validate content type is JSON
    key: responseHeaders.content-type
    value: application/json
    action: include
    stopOnFail: false
