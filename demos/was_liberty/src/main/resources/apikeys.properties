# API Keys Configuration
# 
# Configure valid API keys for the Order API
# Multiple keys can be specified as a comma-separated list
# 
# Format: api.keys=key1,key2,key3
#
# IMPORTANT: 
# - Keep this file secure and never commit real API keys to version control
# - In production, use environment variables (API_KEYS) or system properties instead
# - Generate strong, random API keys (minimum 32 characters recommended)
#
# Example:
# api.keys=dev-key-12345,test-key-67890

# Default development key (CHANGE THIS IN PRODUCTION!)
api.keys=demo-api-key-change-me-in-production

