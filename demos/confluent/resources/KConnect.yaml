apiVersion: platform.confluent.io/v1beta1
kind: KafkaConnect
metadata:
  name: ${VAR_ES_KAFKA_CONNECT_INSTANCE_NAME}
  annotations:
    eventstreams.ibm.com/use-connector-resources: 'true'
  labels:
    backup.eventstreams.ibm.com/component: kafkaconnect
  namespace: $VAR_CONFLUENT_NAMESPACE    
spec:
  config:
    group.id: connect-cluster
    offset.storage.topic: connect-cluster-offsets
    config.storage.topic: connect-cluster-configs
    status.storage.topic: connect-cluster-status
    client.id: connect-cluster-client
    config.providers: file
    config.providers.file.class: org.apache.kafka.common.config.provider.DirectoryConfigProvider
  bootstrapServers: '${VAR_CONFLUENT_INSTANCE_NAME}-kafka-bootstrap.${VAR_CONFLUENT_NAMESPACE}.svc:9093'
  resources:
    requests:
      cpu: 1000m
      memory: 2Gi
    limits:
      cpu: 2000m
      memory: 2Gi
  authentication:
    certificateAndKey:
      certificate: user.crt
      key: user.key
      secretName: kafka-user1
    type: tls      
  template:
    buildConfig:
      pullSecret: ${DEFAULT_IMAGE_PULL_SECRET}
    connectContainer:
      volumeMounts:
        - mountPath: /mnt/mqca
          name: certs
          readOnly: true
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        privileged: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
    pod:
      imagePullSecrets: []
      metadata:
        annotations:
          eventstreams.production.type: Confluent
      volumes:
        - name: certs
          secret:
            secretName: mq-root-secret
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values:
                      - amd64
                      - s390x
                      - ppc64le
  tls:
    trustedCertificates:
      - certificate: ca.crt
        secretName: ${VAR_CONFLUENT_INSTANCE_NAME}-cluster-ca-cert
  replicas: 1
