apiVersion: platform.confluent.io/v1beta1
kind: KafkaTopic
metadata:
  labels:
    eventstreams.ibm.com/cluster: ${VAR_CONFLUENT_INSTANCE_NAME}
    app.kubernetes.io/instance: ${VAR_CONFLUENT_INSTANCE_NAME}
  name: ${VAR_CONFLUENT_TOPIC_NAME}
  namespace: $VAR_CONFLUENT_NAMESPACE
spec:
  config:
    min.insync.replicas: "1"
    retention.ms: "86400000"
  partitions: ${VAR_CONFLUENT_SPEC_TOPIC_PARTITION}
  replicas: ${VAR_CONFLUENT_SPEC_TOPIC_REPLICA}
  topicName: ${VAR_CONFLUENT_SPEC_TOPIC_NAME}