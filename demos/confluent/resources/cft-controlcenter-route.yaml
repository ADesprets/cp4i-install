apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: controlcenter
  namespace: ${VAR_CONFLUENT_NAMESPACE}
  labels:
    app.kubernetes.io/name: controlcenter
    app.kubernetes.io/part-of: confluent-platform
spec:
  to:
    kind: Service
    name: controlcenter
    weight: 100
  port:
    targetPort: 9021
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
