apiVersion: platform.confluent.io/v1beta1
kind: Kafka
metadata:
  name: kafka
  namespace: $VAR_CONFLUENT_NAMESPACE
  finalizers:
    - kafka.finalizers.platform.confluent.io
spec:
  dataVolumeCapacity: 10Gi
  dependencies:
    kRaftController:
      clusterRef:
        name: kraftcontroller
  image:
    application: 'confluentinc/cp-server:8.3.2'
    init: 'confluentinc/confluent-init-container:3.3.1'
  replicas: 3
  tls:
    autoGeneratedCerts: true