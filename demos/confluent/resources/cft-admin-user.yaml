apiVersion: platform.confluent.io/v1beta1
kind: KafkaUser
metadata:
  name: cft-admin
  namespace: $VAR_CONFLUENT_NAMESPACE
  labels:
    app.kubernetes.io/instance: ${VAR_CONFLUENT_INSTANCE_NAME}
    eventstreams.ibm.com/cluster: ${VAR_CONFLUENT_INSTANCE_NAME}
spec:
  authentication:
    type: scram-sha-512
  authorization:
    acls:
      - operations:
          - Alter
          - DescribeConfigs
        resource:
          type: cluster
      - operations:
          - Create
          - Read
          - Write
          - Delete
          - DescribeConfigs
          - Alter
          - AlterConfigs
        resource:
          name: '*'
          patternType: literal
          type: topic
      - operations:
          - Alter
          - Read
        resource:
          name: __schema_
          patternType: prefix
          type: topic
      - operations:
          - Read
          - Delete
        resource:
          name: '*'
          patternType: literal
          type: group
    type: simple