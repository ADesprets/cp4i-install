# Kubernetes Secret for Confluent Control Center admin authentication.
# CFK reads this as a "plain" JAAS credential list for the Control Center UI.
# Reference: https://docs.confluent.io/operator/current/co-configure-control-center.html#configure-control-center-authentication
#
# Variables substituted at runtime (via adapt_file / envsubst):
#   ${VAR_CONFLUENT_NAMESPACE}            - namespace (e.g. iwhi-confluent)
#   ${VAR_CONFLUENT_C3_ADMIN_USERNAME}    - admin username for the Control Center UI
#   ${VAR_CONFLUENT_C3_ADMIN_PASSWORD}    - admin password for the Control Center UI
#
apiVersion: v1
kind: Secret
metadata:
  name: controlcenter-credentials
  namespace: ${VAR_CONFLUENT_NAMESPACE}
  labels:
    app.kubernetes.io/name: controlcenter
    app.kubernetes.io/part-of: confluent-platform
type: Opaque
stringData:
  plain-users.json: |
    {
      "${VAR_CONFLUENT_C3_ADMIN_USERNAME}": "${VAR_CONFLUENT_C3_ADMIN_PASSWORD}"
    }
  plain.txt: ${VAR_CONFLUENT_C3_ADMIN_USERNAME}:${VAR_CONFLUENT_C3_ADMIN_PASSWORD}