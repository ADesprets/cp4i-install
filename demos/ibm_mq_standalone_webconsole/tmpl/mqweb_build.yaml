apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: ${VAR_MQWEB_APP_NAME}
  namespace: ${VAR_MQWEB_NAMESPACE}
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: ${VAR_MQWEB_APP_NAME}
  namespace: ${VAR_MQWEB_NAMESPACE}
spec:
  source:
    type: Binary
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Containerfile
  output:
    to:
      kind: ImageStreamTag
      name: ${VAR_MQWEB_APP_NAME}:${VAR_MQWEB_IMAGE_TAG}
