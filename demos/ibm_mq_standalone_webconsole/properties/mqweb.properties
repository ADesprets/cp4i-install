# -------------------------------------
# IBM MQ stand-alone Web Server (MQ Console) deployed on OpenShift
# -------------------------------------
# The MQ Operator does not manage the stand-alone web server: we build our own image
# from the IBM MQ Web Server tarball (Fix Central, ex: 9.4.0.0-IBM-MQ-Web-Server-LinuxX64.tar.gz)
# and deploy it as a plain Deployment. The console only administers REMOTE queue managers.

# REQUIRED: put the stand-alone MQ Web Server tarball downloaded from Fix Central in the Src directory of this demo
# (sc_component_script_dir is the scripts/ directory, set by mqweb.config.sh before sourcing this file)
VAR_MQWEB_SRC_DIR="$( cd "${sc_component_script_dir}../" && pwd )/Src/"
VAR_MQWEB_ARCHIVE="${VAR_MQWEB_SRC_DIR}10.0.1.0-IBM-MQ-Web-Server-LinuxX64.tar.gz"

# VAR_MQWEB_NAMESPACE, VAR_MQWEB_APP_NAME, VAR_MQWEB_CREDENTIALS_SECRET, VAR_MQWEB_ADMIN_USER and VAR_MQWEB_READER_USER
# are defined in properties/cp4i-variables.properties (also used by display_access_info in lib.sh)
VAR_MQWEB_IMAGE_TAG=10.0
VAR_MQWEB_IMAGE="image-registry.openshift-image-registry.svc:5000/${VAR_MQWEB_NAMESPACE}/${VAR_MQWEB_APP_NAME}:${VAR_MQWEB_IMAGE_TAG}"
VAR_MQWEB_PVC_SIZE=1Gi

# Secrets / ConfigMaps used by the Deployment
VAR_MQWEB_CERTS_SECRET="${VAR_MQWEB_APP_NAME}-mq-certs"
VAR_MQWEB_CONFIG_CM="${VAR_MQWEB_APP_NAME}-config"
VAR_MQWEB_CCDT_CM="${VAR_MQWEB_APP_NAME}-ccdt"


# OPTIONAL: QueueManager resource names of ${VAR_MQ_NAMESPACE} to register during --all (space separated, ex: "orders sensors" from demos/mq_simple)
# Empty: the console is installed alone, queue managers can be added later with: --call add_qmgr_to_mqweb <name> [namespace]
VAR_MQWEB_QMGRS=""
# Dedicated SVRCONN channel created on each queue manager for the console, and the identity it maps to
VAR_MQWEB_CHL="MQWEB.SVRCONN"
VAR_MQWEB_MCAUSER=mqwebadm
