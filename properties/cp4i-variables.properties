VAR_NAVIGATOR_NAMESPACE=ibmint-navigator
VAR_NAVIGATOR_INSTANCE_NAME=navigator

# End-to-end monitoring is deployed next to Platform Navigator: its UI uses the CP4I Keycloak through a
# Cp4iServicesBinding, which is only reconciled by the Platform Navigator operator (watching its own namespace)
VAR_E2E_MONITORING_NAMESPACE=${VAR_NAVIGATOR_NAMESPACE}
# The name of the Monitoring instance must not contain a number, nor be "e2em" (collides with the operator e2em- prefix)
VAR_E2E_MONITORING_INSTANCE_NAME=e2e-monitoring

