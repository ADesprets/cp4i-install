# In namespace scoped, there are several instances of Keycloak, and it is not created in ibm-common-services
# By design, we chose in this installation to have the navigator installing Keycloak and reuse it anywhere else
VAR_KEYCLOAK_NAMESPACE=${VAR_NAVIGATOR_NAMESPACE}
